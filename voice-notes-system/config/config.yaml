# Voice Notes System Configuration

# API Configuration
api:
  openai:
    # Add your OpenAI API key here or set via environment variable OPENAI_API_KEY
    api_key: ""
    model: "whisper-1"
    max_retries: 3
    timeout: 30

# MCP Server Configuration (now running as MCP server for Claude Desktop)
mcp:
  # Server mode configuration
  mode: "server"  # Changed from "client" to "server"

  # Server settings
  host: "localhost"
  port: 8000

  # Server capabilities
  capabilities:
    - "voice_recording"
    - "transcription"
    - "note_creation"
    - "note_search"

  # Legacy client settings (kept for backward compatibility)
  server_url: ""
  api_key: ""
  timeout: 30
  max_connections: 5
  max_retries: 3
  retry_delay: 1.0
  use_mock: false
  pool_size: 5
  keep_alive: true

# Audio Settings
audio:
  # Recording settings
  sample_rate: 44100
  channels: 1
  format: "WAV"

  # Silence detection
  silence_threshold: 0.01
  silence_duration: 2.0  # seconds

  # Audio device (leave empty for default)
  input_device: ""

# Global Hotkeys
hotkeys:
  # Global hotkey to start/stop recording
  record_toggle: "cmd+shift+r"
  # Hotkey to cancel recording
  cancel: "escape"
  # Enable audio feedback on start/stop
  audio_feedback: true

# Processing Options
processing:
  # Processing modes: "quick", "standard", "deep"
  default_mode: "standard"

  # Automatic processing (vs manual trigger)
  auto_process: true

  # Maximum conversation depth
  max_conversation_depth: 5

# File Management
files:
  # Directory to save voice notes (relative to user's Documents or absolute path)
  output_directory: "~/Documents/Voice Notes"

  # File naming pattern: "date", "topic", "hybrid"
  naming_pattern: "hybrid"

  # Create daily subfolders
  daily_folders: true

  # Clean up temporary audio files after processing
  cleanup_temp_files: true

# UI Settings
ui:
  # System tray notifications
  show_notifications: true
  notification_duration: 3  # seconds

  # Status indicator colors
  ready_color: "green"
  recording_color: "red"
  processing_color: "yellow"
  error_color: "gray"

# Logging
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR
  level: "INFO"

  # Log file location
  file: "logs/voice_notes.log"

  # Maximum log file size (MB)
  max_size: 10

  # Number of backup files
  backup_count: 5

# Privacy & Security
privacy:
  # Local-only mode (no API calls)
  local_only: false

  # Encrypt temporary audio files
  encrypt_temp: false

  # Require confirmation before API calls
  confirm_api_calls: false

# Cost Management
cost_management:
  # Daily API cost limit (USD)
  daily_limit: 5.00

  # Monthly API cost limit (USD)
  monthly_limit: 50.00

  # Track usage
  track_usage: true

  # Alert thresholds (percentage of limit)
  warning_threshold: 80
  critical_threshold: 95

# Error Recovery System
error_recovery:
  # Enable error recovery system
  enabled: true

  # Data directory for error logs and recovery queue
  data_directory: "logs"

  # Maximum number of failed operations to queue
  max_queue_size: 100

  # Retry settings
  retry:
    # Base delay for first retry (seconds)
    base_delay: 1

    # Maximum delay between retries (seconds)
    max_delay: 300

    # Backoff multiplier for exponential backoff
    backoff_multiplier: 2

    # Default maximum retries per operation
    max_retries: 3

  # Cleanup settings
  cleanup:
    # Maximum age of error logs to keep (days)
    max_log_age_days: 7

    # Maximum age of recovery queue items (days)
    max_queue_age_days: 3

  # Error notification settings
  notifications:
    # Show user-friendly error messages
    show_user_messages: true

    # Show system notifications for errors
    system_notifications: true

    # Error severity levels to notify about
    notify_levels: ["medium", "high", "critical"]

# Graceful Degradation Settings
degradation:
  # Enable graceful degradation
  enabled: true

  # Services that can be degraded
  fallback_services:
    # Transcription fallbacks
    transcription:
      # Use local speech recognition if API fails
      enable_local_fallback: true
      # Minimum confidence for local transcription
      min_confidence: 0.6

    # MCP/Conversation fallbacks
    conversation:
      # Use mock conversations if MCP unavailable
      enable_mock_fallback: true
      # Skip conversation if all methods fail
      skip_on_failure: true

    # File saving fallbacks
    file_system:
      # Alternative output directories if primary fails
      backup_directories:
        - "~/Desktop/Voice Notes Backup"
        - "/tmp/voice_notes_backup"

  # Service timeout settings (seconds)
  timeouts:
    transcription: 60
    mcp_connection: 30
    file_save: 10
    audio_device: 5